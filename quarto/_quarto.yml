project:
  type: website
  output-dir: quarto_build

version: "0.2.0" 

execute:
  freeze: auto
date: last-modified  

format:
  html:
    theme:
      - minty
      - brand
    toc: true

website:
  title: "rcl"
  page-footer:
    center: "Documentation for version **{{< meta version >}}**"

  navbar:
    background: primary
    search: true
    left:
      - text: "Home"
        file: index.qmd
      - text: "How to use the app"
        file: how/index.qmd        
      - text: "About"
        file: about/index.qmd
        
     

    right:
      - icon: person-circle
        menu:
          - text: "rcl on github"
            href: https://github.com/neelsmith/rcl
          - text: "Neel Smith: other hobby projects"
            href: https://neelsmith.github.io/avocational/
        aria-label: Home 

