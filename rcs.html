<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lectionary Readings</title>
<meta name="description" content="Revised Common Lectionary readings (Episcopal use) for Sundays and Major Holy Days.">
<style>
:root {
  --bg: #f7f5f0;
  --surface: #ffffff;
  --text: #22201c;
  --muted: #6b665c;
  --line: #e2ddd2;
  --accent: #7a1f2b;          /* feast red */
  --accent-soft: #f4e4e4;
  --sunday: #1f4e79;          /* Sunday blue */
  --sunday-soft: #e3ecf5;
  --principal-soft: #f6ead0;
  --principal: #8a5a00;
  --fast: #5b3f7a;
  --fast-soft: #ece5f3;
  --today-ring: #c08a2b;
  --selected: #22201c;
  --selected-text: #ffffff;
  --radius: 10px;
  --serif: "Iowan Old Style", "Palatino Linotype", Palatino, Georgia, "Times New Roman", serif;
  --sans: system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #171614;
    --surface: #211f1c;
    --text: #ece8df;
    --muted: #a39d90;
    --line: #36322c;
    --accent: #e08a92;
    --accent-soft: #3a2427;
    --sunday: #8fb7e0;
    --sunday-soft: #1e2c3a;
    --principal-soft: #3a3020;
    --principal: #e6bd6a;
    --fast: #c3a8e3;
    --fast-soft: #2c2438;
    --today-ring: #e6bd6a;
    --selected: #ece8df;
    --selected-text: #171614;
  }
}
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0; background: var(--bg); color: var(--text);
  font-family: var(--sans); font-size: 16px; line-height: 1.5;
}
header.site {
  max-width: 1120px; margin: 0 auto; padding: 24px 16px 8px;
}
header.site h1 {
  font-family: var(--serif); font-weight: 600; font-size: 1.75rem; margin: 0;
}
header.site p { margin: 2px 0 0; color: var(--muted); font-size: 0.95rem; }
main {
  max-width: 1120px; margin: 0 auto; padding: 8px 16px 32px;
  display: grid; grid-template-columns: minmax(0, 1fr); gap: 20px;
}
@media (min-width: 900px) {
  main { grid-template-columns: minmax(0, 470px) minmax(0, 1fr); align-items: start; }
  .calendar { position: sticky; top: 16px; }
}
.panel {
  background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius);
  padding: 16px;
}
/* ------------------------------------------------------------ calendar */
.cal-head { display: flex; align-items: center; gap: 8px; margin-bottom: 12px; }
.cal-head h2 {
  flex: 1; margin: 0; font-family: var(--serif); font-size: 1.25rem; font-weight: 600;
}
button, input { font: inherit; color: inherit; }
.btn {
  border: 1px solid var(--line); background: var(--surface); border-radius: 8px;
  padding: 6px 10px; cursor: pointer; min-height: 36px;
}
.btn:hover { border-color: var(--muted); }
.btn:focus-visible, .day:focus-visible, input:focus-visible {
  outline: 2px solid var(--today-ring); outline-offset: 2px;
}
.icon-btn { width: 36px; padding: 0; font-size: 1.1rem; line-height: 1; }
.jump { display: flex; gap: 8px; margin-bottom: 12px; flex-wrap: wrap; }
.jump input[type=date] {
  border: 1px solid var(--line); border-radius: 8px; background: var(--surface);
  padding: 5px 8px; min-height: 36px; color-scheme: light dark;
}
.grid { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 4px; }
.dow {
  text-align: center; font-size: 0.75rem; color: var(--muted); padding-bottom: 2px;
  text-transform: uppercase; letter-spacing: 0.04em;
}
.dow.sun { color: var(--sunday); font-weight: 600; }
.day {
  position: relative; display: flex; flex-direction: column; align-items: stretch;
  min-height: 62px; padding: 4px 4px 3px; border-radius: 8px;
  border: 1px solid transparent; background: transparent; cursor: pointer; text-align: left;
}
.day:hover { border-color: var(--line); }
.day .num { font-size: 0.9rem; font-variant-numeric: tabular-nums; }
.day .lab {
  font-size: 0.66rem; line-height: 1.15; margin-top: auto;
  overflow: hidden; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical;
  overflow-wrap: normal; word-break: normal; hyphens: auto;
}
.day.out { opacity: 0.45; }
.day.sunday { background: var(--sunday-soft); }
.day.sunday .num, .day.sunday .lab { color: var(--sunday); }
.day.principal { background: var(--principal-soft); }
.day.principal .num, .day.principal .lab { color: var(--principal); font-weight: 600; }
.day.lordfeast, .day.majorfeast { background: var(--accent-soft); }
.day.lordfeast .num, .day.lordfeast .lab, .day.majorfeast .num, .day.majorfeast .lab { color: var(--accent); }
.day.holyday, .day.other { background: var(--fast-soft); }
.day.holyday .num, .day.holyday .lab, .day.other .num, .day.other .lab { color: var(--fast); }
.day.today { box-shadow: inset 0 0 0 2px var(--today-ring); }
.day.selected { background: var(--selected); }
.day.selected .num, .day.selected .lab { color: var(--selected-text); }
.legend {
  display: flex; flex-wrap: wrap; gap: 6px 14px; margin-top: 12px;
  font-size: 0.8rem; color: var(--muted);
}
.legend span { display: inline-flex; align-items: center; gap: 6px; }
.legend i { width: 12px; height: 12px; border-radius: 3px; display: inline-block; }
.legend .k-sunday { background: var(--sunday-soft); border: 1px solid var(--sunday); }
.legend .k-principal { background: var(--principal-soft); border: 1px solid var(--principal); }
.legend .k-feast { background: var(--accent-soft); border: 1px solid var(--accent); }
.legend .k-fast { background: var(--fast-soft); border: 1px solid var(--fast); }
@media (max-width: 480px) {
  .day { min-height: 54px; padding: 3px 2px; }
  .day .lab { font-size: 0.58rem; }
}
/* ------------------------------------------------------------ readings */
.readings h2.date {
  font-family: var(--serif); font-weight: 600; font-size: 1.4rem; margin: 0 0 4px;
}
.obs { border-top: 1px solid var(--line); padding-top: 14px; margin-top: 14px; }
.obs:first-of-type { border-top: 0; padding-top: 0; margin-top: 8px; }
.obs h3 { font-family: var(--serif); font-weight: 600; font-size: 1.2rem; margin: 0; }
.obs.alternative h3 { font-size: 1.05rem; }
.meta { color: var(--muted); font-size: 0.9rem; margin: 2px 0 10px; }
.tag {
  display: inline-block; font-size: 0.72rem; text-transform: uppercase; letter-spacing: 0.05em;
  border: 1px solid var(--line); border-radius: 999px; padding: 0 8px; margin-right: 6px;
  color: var(--muted);
}
table.lessons { width: 100%; border-collapse: collapse; }
table.lessons th, table.lessons td {
  text-align: left; vertical-align: top; padding: 6px 8px 6px 0; border-bottom: 1px solid var(--line);
}
table.lessons tr:last-child th, table.lessons tr:last-child td { border-bottom: 0; }
table.lessons th[scope=row] {
  width: 8.5em; font-weight: 500; color: var(--muted); font-size: 0.9rem;
}
table.lessons thead th { font-size: 0.8rem; color: var(--muted); font-weight: 600; }
table.lessons td { font-family: var(--serif); font-size: 1.05rem; }
.or { font-family: var(--sans); font-size: 0.8rem; color: var(--muted); font-style: italic; }
.service { margin-top: 10px; }
.service h4 { margin: 8px 0 2px; font-size: 0.95rem; }
.note { font-size: 0.9rem; color: var(--muted); margin: 8px 0 0; }
.notice {
  background: var(--accent-soft); border-radius: 8px; padding: 8px 12px; margin: 10px 0 0;
  font-size: 0.92rem;
}
.linkish {
  border: 0; background: none; padding: 0; color: var(--sunday); text-decoration: underline;
  cursor: pointer;
}
.empty p { margin: 6px 0; }
.src { font-size: 0.8rem; margin-top: 8px; }
.src a { color: var(--muted); }
footer a { color: var(--sunday); }
footer {
  max-width: 1120px; margin: 0 auto; padding: 0 16px 32px; color: var(--muted); font-size: 0.8rem;
}
@media (max-width: 560px) {
  table.lessons th[scope=row] { width: 6.5em; }
  table.lessons td { font-size: 1rem; }
}
</style>
</head>

<header class="site">
  <h1>Lectionary Readings</h1>
  <p>Revised Common Lectionary for Sundays and Major Holy Days, as authorized for the Episcopal Church</p>
</header>
<main>
  <section class="calendar panel" aria-label="Calendar">
    <div class="cal-head">
      <button class="btn icon-btn" id="prev" type="button" aria-label="Previous month">&#8249;</button>
      <h2 id="month-title" aria-live="polite"></h2>
      <button class="btn icon-btn" id="next" type="button" aria-label="Next month">&#8250;</button>
    </div>
    <div class="jump">
      <button class="btn" id="today" type="button">Today</button>
      <label class="sr-only" for="date-input" style="position:absolute;left:-9999px">Go to date</label>
      <input type="date" id="date-input" min="1900-01-01" max="2199-12-31">
    </div>
    <div class="grid" id="grid" role="grid" aria-labelledby="month-title"></div>
    <div class="legend" aria-hidden="true">
      <span><i class="k-sunday"></i>Sunday</span>
      <span><i class="k-principal"></i>Principal Feast</span>
      <span><i class="k-feast"></i>Major Feast</span>
      <span><i class="k-fast"></i>Other holy day</span>
    </div>
  </section>
  <section class="readings panel" id="readings" aria-live="polite"></section>
</main>
<footer>

<script>
/*
 * Liturgical calendar for the Revised Common Lectionary (Episcopal use).
 *
 * Pure functions, no DOM: works in the browser (exposed as `RCL`) and in Node
 * (`require("./lectionary.js")`) so it can be unit tested.
 *
 * Dates are handled as "day numbers": whole days since 1970-01-01 (UTC), so
 * there are no time-zone or daylight-saving surprises.
 *
 * Precedence follows the Book of Common Prayer (1979), pp. 15-18:
 *  - Principal Feasts (Easter Day, Ascension, Pentecost, Trinity Sunday,
 *    All Saints' Day, Christmas Day, the Epiphany) take precedence over any day.
 *  - Sundays take precedence over other fixed feasts, except the Holy Name,
 *    the Presentation and the Transfiguration, which replace the Sunday
 *    (the Sunday's readings are listed as an alternative).
 *  - Other Major Feasts falling on a Sunday, a Principal Feast or Ash Wednesday
 *    are transferred to the next open weekday.
 *  - Feasts falling in Holy Week or Easter Week are transferred, in order, to
 *    the week following the Second Sunday of Easter.
 *  - All Saints' Day may also be observed on the Sunday following November 1
 *    (listed as an alternative on that Sunday).
 */
(function (root, factory) {
  "use strict";
  var api = factory();
  if (typeof module === "object" && module.exports) {
    module.exports = api;
  } else {
    root.RCL = api;
  }
})(typeof self !== "undefined" ? self : this, function () {
  "use strict";

  var COLUMNS = ["id", "label", "year", "season", "track", "fixed_date",
    "first_reading", "psalm", "second_reading", "gospel", "notes", "source_url"];

  // ------------------------------------------------------------- dates
  function dayNumber(y, m, d) {
    return Math.round(Date.UTC(y, m - 1, d) / 86400000);
  }
  function fromDayNumber(dn) {
    var t = new Date(dn * 86400000);
    return { y: t.getUTCFullYear(), m: t.getUTCMonth() + 1, d: t.getUTCDate() };
  }
  function dayOfWeek(dn) { // 0 = Sunday
    return (((dn + 4) % 7) + 7) % 7;
  }
  function isoDate(dn) {
    var p = fromDayNumber(dn);
    return p.y + "-" + String(p.m).padStart(2, "0") + "-" + String(p.d).padStart(2, "0");
  }
  function parseIsoDate(s) {
    var m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(s || "");
    if (!m) return null;
    var dn = dayNumber(+m[1], +m[2], +m[3]);
    return isoDate(dn) === s ? dn : null;
  }
  /** First Sunday on or after dn. */
  function sundayOnOrAfter(dn) { return dn + ((7 - dayOfWeek(dn)) % 7); }

  /** Easter Day (Gregorian calendar), anonymous algorithm. */
  function easter(y) {
    var a = y % 19, b = Math.floor(y / 100), c = y % 100,
      d = Math.floor(b / 4), e = b % 4, f = Math.floor((b + 8) / 25),
      g = Math.floor((b - f + 1) / 3), h = (19 * a + b - d - g + 15) % 30,
      i = Math.floor(c / 4), k = c % 4, l = (32 + 2 * e + 2 * i - h - k) % 7,
      m = Math.floor((a + 11 * h + 22 * l) / 451),
      month = Math.floor((h + l - 7 * m + 114) / 31),
      day = ((h + l - 7 * m + 114) % 31) + 1;
    return dayNumber(y, month, day);
  }
  /** First Sunday of Advent: the Sunday nearest November 30 (Nov 27 - Dec 3). */
  function advent1(y) { return sundayOnOrAfter(dayNumber(y, 11, 27)); }

  /** Lectionary year letter (A, B, C) for a date. Year A begins Advent 2025, 2028, ... */
  function yearLetter(dn) {
    var y = fromDayNumber(dn).y;
    var ends = dn >= advent1(y) ? y + 1 : y;
    return ["C", "A", "B"][((ends % 3) + 3) % 3];
  }

  // -------------------------------------------------------------- data
  function parseData(text) {
    var lines = text.split(/\r?\n/).filter(function (l) { return l.trim(); });
    var header = lines[0].split("|");
    return lines.slice(1).map(function (line) {
      var f = line.split("|"), row = {};
      header.forEach(function (h, i) { row[h] = f[i] || ""; });
      return row;
    });
  }

  /** Rows for an observance slug in a given year letter (e.g. "proper-11", "A"). */
  function rowsFor(rows, slug, letter) {
    var y = letter.toLowerCase() + "-" + slug, abc = "abc-" + slug;
    var found = rows.filter(function (r) {
      return r.id === y || r.id.indexOf(y + "-t") === 0;
    });
    if (found.length) return found;
    return rows.filter(function (r) {
      return r.id === abc || (slug === "christmas-day" && r.id.indexOf("abc-christmas-day-") === 0);
    });
  }

  // ---------------------------------------------------------- calendar
  var PRINCIPAL = "principal", SUNDAY = "sunday", LORD = "lordfeast",
    MAJOR = "majorfeast", FAST = "holyday", OTHER = "other";
  var LORD_FEASTS = { "holy-name": 1, "presentation": 1, "transfiguration": 1 };
  var PRINCIPAL_FIXED = { "christmas-day": 1, "epiphany": 1 };

  /** Fixed-date holy days from the data: [{slug, month, day}] (excluding principal feasts). */
  function fixedFeasts(rows) {
    var seen = {}, out = [];
    rows.forEach(function (r) {
      if (!r.fixed_date || r.year !== "ABC") return;
      var slug = r.id.replace(/^abc-/, "").replace(/-\d$/, "");
      if (slug.indexOf("christmas-day") === 0) slug = "christmas-day";
      if (PRINCIPAL_FIXED[slug] || seen[slug]) return;
      seen[slug] = 1;
      var md = r.fixed_date.split("-");
      out.push({ slug: slug, month: +md[0], day: +md[1] });
    });
    return out;
  }

  var cache = {};

  /**
   * All observances in calendar year y: object mapping day number ->
   * array of {slug, letter, rank, role, note, otherDn}. `role` is "primary",
   * "alternative" (may be used instead) or "transferred" (moved to otherDn).
   * For transferred feasts `note` is "transferred-from" / "transferred-to" and
   * `otherDn` is the day it moved from / to.
   */
  function calendarYear(rows, y) {
    if (cache[y] && cache[y].rows === rows) return cache[y].days;
    var days = {}, blocked = {}, E = easter(y), adv = advent1(y);

    function add(dn, slug, rank, role, note, otherDn) {
      (days[dn] = days[dn] || []).push({
        slug: slug, letter: yearLetter(dn), rank: rank, role: role || "primary", note: note || "",
        otherDn: otherDn === undefined ? null : otherDn
      });
    }
    function displaceSundays(dn, why) {
      (days[dn] || []).forEach(function (o) {
        if (o.rank === SUNDAY && o.role === "primary") {
          o.role = "alternative";
          o.note = "Readings of the Sunday, displaced by " + why + ".";
        }
      });
    }
    function block(dn, why) { blocked[dn] = why; }

    // Christmas season (start of the calendar year)
    var jan1 = dayNumber(y, 1, 1);
    if (dayOfWeek(jan1) === 0) add(jan1, "christmas-1", SUNDAY);
    for (var d = 2; d <= 5; d++) {
      if (dayOfWeek(dayNumber(y, 1, d)) === 0) add(dayNumber(y, 1, d), "christmas-2", SUNDAY);
    }
    // Epiphany and the Sundays after
    var epiphany = dayNumber(y, 1, 6);
    add(epiphany, "epiphany", PRINCIPAL); block(epiphany, "principal");
    var lastEpi = E - 49, n = 1;
    for (var s = sundayOnOrAfter(epiphany + 1); s < lastEpi; s += 7, n++) {
      add(s, "epiphany-" + n, SUNDAY);
    }
    add(lastEpi, "epiphany-last", SUNDAY);
    // Lent, Holy Week, Easter
    add(E - 46, "ash-wednesday", FAST); block(E - 46, "ash-wednesday");
    for (n = 1; n <= 5; n++) add(E - 49 + 7 * n, "lent-" + n, SUNDAY);
    add(E - 7, "palm-sunday", SUNDAY); block(E - 7, "holy-week");
    ["holy-monday", "holy-tuesday", "holy-wednesday", "maundy-thursday", "good-friday", "holy-saturday"]
      .forEach(function (slug, i) { add(E - 6 + i, slug, FAST); block(E - 6 + i, "holy-week"); });
    add(E, "easter-day", PRINCIPAL);
    for (d = 0; d <= 6; d++) block(E + d, "holy-week");
    for (n = 2; n <= 7; n++) add(E + 7 * (n - 1), "easter-" + n, SUNDAY);
    add(E + 39, "ascension", PRINCIPAL); block(E + 39, "principal");
    add(E + 49, "pentecost", PRINCIPAL); block(E + 49, "principal");
    add(E + 56, "trinity", PRINCIPAL); block(E + 56, "principal");
    // Season after Pentecost: Proper n is the Sunday closest to May 25 + 7(n-3)
    var may25 = dayNumber(y, 5, 25);
    for (s = E + 63; s < adv; s += 7) {
      add(s, "proper-" + (3 + Math.round((s - may25) / 7)), SUNDAY);
    }
    // All Saints' Day; Thanksgiving Day (fourth Thursday of November)
    var nov1 = dayNumber(y, 11, 1);
    displaceSundays(nov1, "All Saints\u2019 Day");
    add(nov1, "all-saints", PRINCIPAL); block(nov1, "principal");
    if (dayOfWeek(nov1) !== 0) {
      add(sundayOnOrAfter(nov1), "all-saints", PRINCIPAL, "alternative",
        "All Saints’ Day may also be observed on the Sunday following November 1.");
    }
    var firstThursday = nov1 + ((4 - dayOfWeek(nov1) + 7) % 7);
    add(firstThursday + 21, "thanksgiving", OTHER);
    // Advent and Christmas
    for (n = 1; n <= 4; n++) add(adv + 7 * (n - 1), "advent-" + n, SUNDAY);
    var xmas = dayNumber(y, 12, 25);
    add(xmas, "christmas-day", PRINCIPAL); block(xmas, "principal");
    for (s = xmas + 1; s <= dayNumber(y, 12, 31); s++) {
      if (dayOfWeek(s) === 0) add(s, "christmas-1", SUNDAY);
    }

    // Fixed feasts: place on their own day when possible, then transfer the rest.
    var occupied = {}, pending = [], easterWeekQueue = [];
    fixedFeasts(rows).forEach(function (f) {
      var dn = dayNumber(y, f.month, f.day);
      var lord = !!LORD_FEASTS[f.slug];
      var isSunday = dayOfWeek(dn) === 0;
      if (blocked[dn] === "holy-week") {
        easterWeekQueue.push({ f: f, dn: dn });
      } else if (blocked[dn]) {
        pending.push({ f: f, dn: dn });
      } else if (isSunday && lord) {
        displaceSundays(dn, "the feast");
        add(dn, f.slug, LORD); occupied[dn] = 1;
      } else if (isSunday) {
        pending.push({ f: f, dn: dn });
      } else {
        add(dn, f.slug, lord ? LORD : MAJOR); occupied[dn] = 1;
      }
    });
    function isOpen(dn) {
      return dayOfWeek(dn) !== 0 && !blocked[dn] && !occupied[dn];
    }
    function transfer(item, start) {
      var to = start;
      while (!isOpen(to)) to++;
      occupied[to] = 1;
      var rank = LORD_FEASTS[item.f.slug] ? LORD : MAJOR;
      add(to, item.f.slug, rank, "primary", "transferred-from", item.dn);
      add(item.dn, item.f.slug, rank, "transferred", "transferred-to", to);
    }
    // Transfer in order of original date; Holy Week / Easter Week feasts start
    // looking on the Monday after the Second Sunday of Easter.
    easterWeekQueue.forEach(function (item) { item.start = E + 8; });
    pending.forEach(function (item) { item.start = item.dn + 1; });
    pending.concat(easterWeekQueue)
      .sort(function (a, b) { return a.dn - b.dn; })
      .forEach(function (item) { transfer(item, Math.max(item.start, item.dn + 1)); });

    cache[y] = { rows: rows, days: days };
    return days;
  }

  var RANK_ORDER = { principal: 0, lordfeast: 1, sunday: 2, holyday: 3, majorfeast: 4, other: 5 };
  var ROLE_ORDER = { primary: 0, alternative: 1, transferred: 2 };

  /** Observances on a day, with their readings rows attached, primary first. */
  function observancesOn(rows, dn) {
    var list = (calendarYear(rows, fromDayNumber(dn).y)[dn] || []).map(function (o) {
      return {
        slug: o.slug, letter: o.letter, rank: o.rank, role: o.role, note: o.note,
        otherDn: o.otherDn, rows: rowsFor(rows, o.slug, o.letter)
      };
    });
    return list.sort(function (a, b) {
      return (ROLE_ORDER[a.role] - ROLE_ORDER[b.role]) || (RANK_ORDER[a.rank] - RANK_ORDER[b.rank]);
    });
  }

  /** The next day after dn (within ~400 days) with a primary observance. */
  function nextObservance(rows, dn) {
    for (var d = dn + 1; d < dn + 400; d++) {
      var obs = observancesOn(rows, d).filter(function (o) { return o.role === "primary"; });
      if (obs.length) return { dn: d, observances: obs };
    }
    return null;
  }

  // ---------------------------------------------------------- labels
  var SHORT = {
    "christmas-day": "Christmas Day", "epiphany": "Epiphany", "epiphany-1": "Baptism of Our Lord",
    "epiphany-last": "Last Epiphany", "ash-wednesday": "Ash Wednesday", "palm-sunday": "Palm Sunday",
    "holy-monday": "Holy Monday", "holy-tuesday": "Holy Tuesday", "holy-wednesday": "Holy Wednesday",
    "maundy-thursday": "Maundy Thursday", "good-friday": "Good Friday", "holy-saturday": "Holy Saturday",
    "easter-day": "Easter Day", "ascension": "Ascension", "pentecost": "Pentecost",
    "trinity": "Trinity Sunday", "all-saints": "All Saints", "thanksgiving": "Thanks\u00adgiving"
  };
  function shortLabel(obs) {
    var s = obs.slug, m;
    if (SHORT[s]) return SHORT[s];
    if ((m = /^(advent|lent|easter|christmas|epiphany|proper)-(\d+)$/.exec(s))) {
      return m[1].charAt(0).toUpperCase() + m[1].slice(1) + " " + m[2];
    }
    var label = obs.rows.length ? obs.rows[0].label : s;
    return label.replace(/^The /, "").replace(/ of Our Lord.*$/, "")
      .replace(/ of the Blessed Virgin Mary$/, "").replace(/,.*$/, "")
      .replace(/ the (Apostle|Evangelist)$/, "").replace(/Saint /g, "St. ");
  }
  function fullLabel(obs) {
    if (!obs.rows.length) return shortLabel(obs);
    return obs.rows[0].label.replace(/: Christmas Day I+$/, ": Christmas Day");
  }

  // ------------------------------------------------------- citations
  /** "Psalm 103:1-103:13, 103:22" -> "Psalm 103:1-13, 22" (drops repeated chapters). */
  function compactCitation(field) {
    if (!field) return field;
    return field.split(" or ").map(function (alt) {
      var m = /^(.*?[A-Za-z]) ([(\d].*)$/.exec(alt);
      if (!m) return alt;
      var chapter = null;
      var refs = m[2].replace(/[^(),\s]+/g, function (tok) {
        return tok.split("-").map(function (p) {
          var cv = p.split(":");
          if (cv.length !== 2) return p;
          var out = cv[0] === chapter ? cv[1] : p;
          chapter = cv[0];
          return out;
        }).join("-");
      });
      return m[1] + " " + refs;
    }).join(" or ");
  }
  /**
   * Compact citations inside free text (notes): a chapter is dropped when it
   * repeats the chapter of the preceding reference in the same citation.
   * Any letters between references start a new citation.
   */
  function compactText(text) {
    var chapter = null, last = 0;
    return (text || "").replace(/(\d+):(\d+[a-z]?)/g, function (all, c, v, offset, whole) {
      if (/[A-Za-z]/.test(whole.slice(last, offset))) chapter = null;
      last = offset + all.length;
      var out = c === chapter ? v : all;
      chapter = c;
      return out;
    });
  }

  return {
    COLUMNS: COLUMNS,
    dayNumber: dayNumber, fromDayNumber: fromDayNumber, dayOfWeek: dayOfWeek,
    isoDate: isoDate, parseIsoDate: parseIsoDate, sundayOnOrAfter: sundayOnOrAfter,
    easter: easter, advent1: advent1, yearLetter: yearLetter,
    parseData: parseData, rowsFor: rowsFor, fixedFeasts: fixedFeasts,
    calendarYear: calendarYear, observancesOn: observancesOn, nextObservance: nextObservance,
    shortLabel: shortLabel, fullLabel: fullLabel,
    compactCitation: compactCitation, compactText: compactText
  };
});

<script>
/* Calendar and readings UI. Depends on lectionary.js (global RCL). */
(function () {
  "use strict";
  var R = window.RCL;
  var rows = R.parseData(document.getElementById("rcl-data").textContent);

  var SEASONS = {
    advent: "Advent", christmas: "Christmas", epiphany: "Season after the Epiphany",
    lent: "Lent", holy_week: "Holy Week", easter: "Easter Season",
    after_pentecost: "Season after Pentecost", holy_day: "Holy Day"
  };
  var LESSONS = [
    ["first_reading", "First reading"], ["psalm", "Psalm"],
    ["second_reading", "Second reading"], ["gospel", "Gospel"]
  ];
  var MONTHS = ["January", "February", "March", "April", "May", "June", "July",
    "August", "September", "October", "November", "December"];

  var el = {
    grid: document.getElementById("grid"), title: document.getElementById("month-title"),
    prev: document.getElementById("prev"), next: document.getElementById("next"),
    today: document.getElementById("today"), input: document.getElementById("date-input"),
    readings: document.getElementById("readings")
  };

  function todayDn() {
    var t = new Date();
    return R.dayNumber(t.getFullYear(), t.getMonth() + 1, t.getDate());
  }
  function longDate(dn) {
    return new Date(dn * 86400000).toLocaleDateString("en-US", {
      weekday: "long", year: "numeric", month: "long", day: "numeric", timeZone: "UTC"
    });
  }
  function shortDate(dn) {
    return new Date(dn * 86400000).toLocaleDateString("en-US", {
      weekday: "long", month: "long", day: "numeric", timeZone: "UTC"
    });
  }
  function h(tag, attrs, children) {
    var n = document.createElement(tag);
    Object.keys(attrs || {}).forEach(function (k) {
      if (k === "text") n.textContent = attrs[k];
      else if (k === "class") n.className = attrs[k];
      else if (k.indexOf("on") === 0) n.addEventListener(k.slice(2), attrs[k]);
      else n.setAttribute(k, attrs[k]);
    });
    (children || []).forEach(function (c) {
      if (c != null) n.appendChild(typeof c === "string" ? document.createTextNode(c) : c);
    });
    return n;
  }

  var state = { selected: todayDn(), viewY: 0, viewM: 0 };

  function primaryOf(list) {
    for (var i = 0; i < list.length; i++) if (list[i].role === "primary") return list[i];
    return null;
  }

  // ------------------------------------------------------------ calendar
  function renderCalendar() {
    var y = state.viewY, m = state.viewM;
    el.title.textContent = MONTHS[m - 1] + " " + y;
    el.grid.textContent = "";
    ["Sun", "Mon", "Tue", "Wed", "Thu", "Fri", "Sat"].forEach(function (d, i) {
      el.grid.appendChild(h("div", { class: "dow" + (i === 0 ? " sun" : ""), role: "columnheader", text: d }));
    });
    var first = R.dayNumber(y, m, 1);
    var start = first - R.dayOfWeek(first);
    var last = R.dayNumber(m === 12 ? y + 1 : y, m === 12 ? 1 : m + 1, 1) - 1;
    var end = last + (6 - R.dayOfWeek(last));
    var today = todayDn();
    for (var dn = start; dn <= end; dn++) {
      var p = R.fromDayNumber(dn);
      var obs = primaryOf(R.observancesOn(rows, dn));
      var cls = "day";
      if (p.m !== m) cls += " out";
      if (obs) cls += " " + obs.rank;
      if (dn === today) cls += " today";
      if (dn === state.selected) cls += " selected";
      var label = obs ? R.shortLabel(obs) : "";
      var aria = longDate(dn) + (label ? ", " + label : "");
      el.grid.appendChild(h("button", {
        type: "button", class: cls, "data-dn": String(dn), "aria-label": aria, title: aria,
        "aria-pressed": dn === state.selected ? "true" : "false",
        tabindex: dn === state.selected ? "0" : "-1",
        onclick: (function (d) { return function () { select(d); }; })(dn)
      }, [h("span", { class: "num", text: String(p.d) }), h("span", { class: "lab", text: label })]));
    }
  }

  // ------------------------------------------------------------ readings
  function citationCell(text) {
    var td = h("td");
    if (!text) { td.textContent = "—"; return td; }
    R.compactCitation(text).split(" or ").forEach(function (alt, i) {
      if (i) td.appendChild(h("span", { class: "or", text: " or " }));
      td.appendChild(document.createTextNode(alt));
    });
    td.title = text;
    return td;
  }

  function lessonsTable(rs) {
    var tracked = rs.length > 1 && rs.every(function (r) { return r.track; });
    var table = h("table", { class: "lessons" });
    if (tracked) {
      table.appendChild(h("thead", {}, [h("tr", {}, [h("th", { text: "" })].concat(rs.map(function (r) {
        return h("th", { scope: "col", text: "Track " + r.track + (r.track === "1" ? " (semicontinuous)" : " (related)") });
      })))]));
    }
    var body = h("tbody");
    LESSONS.forEach(function (pair) {
      var key = pair[0], tr = h("tr", {}, [h("th", { scope: "row", text: pair[1] })]);
      var same = rs.every(function (r) { return r[key] === rs[0][key]; });
      if (tracked && !same) {
        rs.forEach(function (r) { tr.appendChild(citationCell(r[key])); });
      } else {
        var td = citationCell(rs[0][key]);
        if (tracked) td.colSpan = rs.length;
        tr.appendChild(td);
      }
      body.appendChild(tr);
    });
    table.appendChild(body);
    return table;
  }

  function notesFor(rs) {
    var out = [], seen = {};
    rs.forEach(function (r) {
      if (!r.notes || seen[r.notes]) return;
      seen[r.notes] = 1;
      var prefix = rs.length > 1 && r.track ? "Track " + r.track + ": " : "";
      out.push(h("p", { class: "note", text: prefix + R.compactText(r.notes) }));
    });
    return out;
  }

  function sourceLinks(rs) {
    var urls = [];
    rs.forEach(function (r) { if (r.source_url && urls.indexOf(r.source_url) < 0) urls.push(r.source_url); });
    var p = h("p", { class: "src" });
    urls.forEach(function (u, i) {
      if (i) p.appendChild(document.createTextNode(" \u00b7 "));
      p.appendChild(h("a", { href: u, target: "_blank", rel: "noopener",
        text: urls.length > 1 ? "Source text " + (i + 1) : "Source text" }));
    });
    return p;
  }

  function goButton(dn, text) {
    return h("button", { type: "button", class: "linkish", text: text, onclick: function () { select(dn); } });
  }

  function observanceSection(o) {
    var sec = h("section", { class: "obs " + o.role });
    var title = R.fullLabel(o);
    if (o.role === "transferred") {
      sec.appendChild(h("p", { class: "notice" }, [
        R.shortLabel(o) + " is transferred to ", goButton(o.otherDn, shortDate(o.otherDn)), "."
      ]));
      return sec;
    }
    if (o.role === "alternative") {
      sec.appendChild(h("p", { class: "meta" }, [h("span", { class: "tag", text: "Alternative" }),
        o.note || "These readings may be used instead."]));
    }
    sec.appendChild(h("h3", { text: title }));
    var season = o.rows.length ? SEASONS[o.rows[0].season] || "" : "";
    var meta = [o.rows.length && o.rows[0].year === "ABC" ? "All years" : "Year " + o.letter];
    if (season) meta.push(season);
    sec.appendChild(h("p", { class: "meta", text: meta.join(" · ") }));
    if (o.note === "transferred-from") {
      sec.appendChild(h("p", { class: "notice" }, ["Transferred from ", goButton(o.otherDn, shortDate(o.otherDn)), "."]));
    }
    var christmas = o.slug === "christmas-day";
    if (christmas) {
      o.rows.forEach(function (r) {
        var svc = h("div", { class: "service" }, [h("h4", { text: r.label.replace(/^.*: /, "") }),
          lessonsTable([r]), sourceLinks([r])]);
        sec.appendChild(svc);
      });
    } else if (o.rows.length) {
      sec.appendChild(lessonsTable(o.rows));
    }
    notesFor(o.rows).forEach(function (n) { sec.appendChild(n); });
    if (o.rows.length && !christmas) sec.appendChild(sourceLinks(o.rows));
    return sec;
  }

  function renderReadings() {
    var dn = state.selected, list = R.observancesOn(rows, dn);
    el.readings.textContent = "";
    el.readings.appendChild(h("h2", { class: "date", text: longDate(dn) }));
    var shown = list.filter(function (o) { return o.role !== "transferred"; });
    if (!shown.length) {
      var box = h("div", { class: "empty" }, [
        h("p", { class: "meta", text: "No Sunday or Major Holy Day readings are appointed for this date." })
      ]);
      var nxt = R.nextObservance(rows, dn);
      if (nxt) {
        box.appendChild(h("p", {}, ["Next: ", goButton(nxt.dn,
          shortDate(nxt.dn) + " — " + R.shortLabel(nxt.observances[0]))]));
      }
      el.readings.appendChild(box);
    }
    list.forEach(function (o) { el.readings.appendChild(observanceSection(o)); });
  }

  // ------------------------------------------------------------ state
  function select(dn, opts) {
    var hadFocus = !!(document.activeElement && el.grid.contains(document.activeElement));
    state.selected = dn;
    var p = R.fromDayNumber(dn);
    state.viewY = p.y; state.viewM = p.m;
    el.input.value = R.isoDate(dn);
    renderCalendar();
    renderReadings();
    try { history.replaceState(null, "", "#" + R.isoDate(dn)); } catch (e) { /* file:// in some browsers */ }
    if (hadFocus && (!opts || opts.focus !== false)) {
      var btn = el.grid.querySelector('[data-dn="' + dn + '"]');
      if (btn) btn.focus();
    }
  }
  function shiftMonth(delta) {
    var m = state.viewM + delta, y = state.viewY;
    while (m < 1) { m += 12; y--; }
    while (m > 12) { m -= 12; y++; }
    state.viewY = y; state.viewM = m;
    renderCalendar();
  }

  el.prev.addEventListener("click", function () { shiftMonth(-1); });
  el.next.addEventListener("click", function () { shiftMonth(1); });
  el.today.addEventListener("click", function () { select(todayDn()); });
  el.input.addEventListener("change", function () {
    var dn = R.parseIsoDate(el.input.value);
    if (dn !== null) select(dn);
  });
  el.grid.addEventListener("keydown", function (ev) {
    var step = { ArrowLeft: -1, ArrowRight: 1, ArrowUp: -7, ArrowDown: 7 }[ev.key];
    if (step === undefined) return;
    ev.preventDefault();
    select(state.selected + step);
  });
  window.addEventListener("hashchange", function () {
    var dn = R.parseIsoDate(location.hash.slice(1));
    if (dn !== null && dn !== state.selected) select(dn, { focus: false });
  });

  var initial = R.parseIsoDate(location.hash.slice(1));
  select(initial !== null ? initial : todayDn(), { focus: false });
})();

</script>
</body>
</html>
